<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC LibSys</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inspiration&family=M+PLUS+1p&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Pontano+Sans:wght@300&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h3>TLC LibSys</h3>
        <nav>        
            <a href="#home">Home</a>
            <a href="#browse_books">Browse</a>
            <a href="">My Books</a>
            <a href="">History</a>
        </nav>
    </header>

    <div class="section" id="home">
        <div>
            <h1>Welcome to TLC LibSys</h1>
            <p>Discover a world of knowledge and imagination with our vast collection of books.</p>
            <a href="#browse_books"><button id="browse_btn">Browse</button></a>
        </div>
        <img src="../imgs/homeimg.png" alt="" id="homeimg">
    </div>
    <div class="section" id="browse_books">
        <div>
            <h2>Browse Books</h2>
            <p>Discover our extensive collection of books across various genres.</p>
        </div>
    </div>
    <div class="section" id="about">

    </div>
</body>
</html>
<style>
*{
    text-decoration: none;        
    margin: 0;
}
body{
    min-height: 100vh;
    font-family: "Nunito", sans-serif;
}

header{
    padding: 1rem 0;
    display: flex; gap: 1rem;
    position: absolute;
    z-index: 5;
    background-color: #16100a64;
    color: #FDF2E9;
    width: 100%;
    align-items: center;
    border-bottom: 1px solid #7D6B5A;
}
header h3{
    padding: 0 2rem; margin-right: 2rem;
    font-size: 1.5rem;
}
nav{
    padding: 5px;
    border-radius: 50px;
    border: 1px solid #7D6B5A;
    background-color: #3E2C1B;
}
nav a{
    padding: 1px 2rem; 
    color: #FDF2E9;
    border-radius: 20px;
}

.section{
    background-color: #FDF2E9;
    min-height: 100vh;
    align-items: center;
}

#home{
    width: 100%; display: flex;
    background-image: url(../imgs/homebg.jpg);
}
#home::before{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(42, 28, 23, 0.75);
    backdrop-filter: blur(3px);
}

#home div{
    z-index: 1;
    width: 100%;
    padding: 5rem;
    color: #FDF2E9;
}
#home h1{
    font-family: "Montserrat Alternates", sans-serif;
    margin-bottom: 1.5rem;
    font-size: 3rem;
}
#homeimg{
    z-index: 1;
    width: 100%; height: 30rem; object-fit: contain;
}
#browse_btn{
    background-color: transparent;
    margin-top: 2rem;
    padding: .5rem 2.5rem;
    border-radius: 10px;
    border: 1px solid #FDF2E9;
    text-transform: uppercase;
    font-size: 0.9rem;
    color: #FDF2E9;
}
#browse_btn:hover{
    cursor: pointer;
}

/* Browse Books */
#browse_books{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    padding: 2rem;
    background-image: linear-gradient(to bottom, #1E130A, #3E2C1B);
}
</style>
