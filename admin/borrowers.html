<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC LibSys — Borrowers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/adminstyle.css">
    <link rel="stylesheet" href="../assets/css/Collection.css">
    <link rel="stylesheet" href="../assets/css/borrowers.css">
    <script src="../assets/js/admin/borrowers.js" defer></script>
</head>
<body>
    <header>
        <h3>TLC LibSys</h3>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="collection.html">Collection</a>
            <a href="borrowers.html">Borrowers</a>
        </nav>
    </header>

    <main class="container">
        <div class="toolbar">
            <h2>Borrowers</h2>
            <input type="search" id="loan_search" placeholder="Search borrower, email, book title...">
            <select id="loan_filter" aria-label="Filter loans">
                <option value="current">Current loans</option>
                <option value="overdue">Overdue only</option>
                <option value="returned">Returned</option>
                <option value="all">All loans</option>
            </select>
        </div>

        <div class="table_scroll">
            <table>
                <thead>
                    <tr>
                        <th>Borrower</th><th>Email</th><th>Course / Year</th><th>Book</th>
                        <th>Date Borrowed</th><th>Due Date</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="loans_table_body"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
